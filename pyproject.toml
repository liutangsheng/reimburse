[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reimburse"
version = "0.1.0"
description = "自动读取餐饮与交通报销材料、校验合规并生成合并费用报销单 PDF"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pypdf>=4.0.0",
    "reportlab>=4.0.0,<4.1.0; python_version < '3.10'",
    "reportlab>=4.0.0; python_version >= '3.10'",
    "pillow>=10.0.0",
]

[project.scripts]
reimburse = "main:main"
reimburse-ui = "web_ui:main"

[tool.setuptools]
py-modules = ["main", "web_ui"]
